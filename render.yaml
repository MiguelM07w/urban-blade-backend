# Blueprint de Render para el backend de Urban Blade.
# Render lo lee al conectar el repo (Blueprint) y autoconfigura el servicio.
# Los valores de las variables se rellenan en el panel de Render (sync: false).
services:
  - type: web
    name: urban-blade-api
    runtime: node
    region: oregon # cámbialo a la región más cercana si lo prefieres
    plan: free # súbelo a starter/standard cuando salgas de pruebas
    branch: main
    # Render ya trae pnpm disponible (detecta el pnpm-lock.yaml); NO uses
    # `corepack enable` aquí: intenta reescribir /usr/bin/pnpm (solo lectura) y
    # falla con EROFS. Solo instala y compila.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      # PORT lo inyecta Render automáticamente; la app ya lo lee del entorno.
      # --- Secretos: se rellenan en el panel (Environment), NO se commitean ---
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESET_URL_BASE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_ORDERS
        sync: false
      - key: STRIPE_CURRENCY
        value: mxn
      - key: THROTTLE_TTL
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"
